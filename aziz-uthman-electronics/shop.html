<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Aziz Uthman Electronics</title>
<meta name="description" content="Browse laptops, graphics cards, processors, memory, storage, monitors and accessories. Filter by category, brand, price and availability.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@500&family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* Sets the theme before the page paints, so there is no flash of the wrong
   colours. The full logic lives in assets/js/app.js. */
(function () {
  try {
    var t = localStorage.getItem('aziz.theme');
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="wrap">
    <nav class="breadcrumbs" id="shop-crumbs" aria-label="Breadcrumb"></nav>
  </div>

  <div class="page-head">
    <div class="wrap">
      <h1 id="shop-title">Shop</h1>
      <p id="shop-sub"></p>
    </div>
  </div>

  <div class="wrap">
    <div class="shop-layout">

      <!-- FILTERS -->
      <aside class="filters" id="filters" aria-label="Product filters">
        <div class="filter-head">
          <h2>Filters</h2>
          <div style="display:flex;gap:10px;align-items:center">
            <button type="button" id="clear-filters">Clear all</button>
            <button type="button" class="icon-x" id="filter-close" aria-label="Close filters" style="display:none">&times;</button>
          </div>
        </div>
        <div id="filter-body"></div>
      </aside>

      <!-- RESULTS -->
      <section>
        <div class="shop-toolbar">
          <span class="count" id="result-count"></span>
          <div class="toolbar-right">
            <button class="btn btn-ghost btn-sm filter-toggle" type="button" id="filter-toggle">Filters</button>
            <label class="sr-only" for="sort-select">Sort products</label>
            <select id="sort-select">
              <option value="featured">Featured</option>
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="discount">Biggest discount</option>
              <option value="name">Name: A–Z</option>
            </select>
          </div>
        </div>

        <div class="active-filters" id="active-filters"></div>
        <div class="grid-products" id="shop-grid"></div>
        <div class="pagination" id="pagination"></div>
      </section>

    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/products.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages.js"></script>
<script>
  Pages.shop();
  // the close button inside the filter sheet is only needed on small screens
  (function () {
    var btn = document.getElementById('filter-close');
    function sync() { btn.style.display = window.innerWidth <= 1024 ? 'grid' : 'none'; }
    sync();
    window.addEventListener('resize', sync);
  })();
</script>
</body>
</html>
